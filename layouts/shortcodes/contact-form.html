<div class="contact-layout">
  <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <div class="form-group">
      <label for="name">Your Name *</label>
      <input type="text" id="name" name="name" required>
    </div>
    
    <div class="form-group">
      <label for="email">Your Email *</label>
      <input type="email" id="email" name="email" required>
    </div>
    
    <div class="form-group">
      <label for="dog-name">Dog's Name *</label>
      <input type="text" id="dog-name" name="dog_name" required>
    </div>
    
    <div class="form-group">
      <label for="service">Service Interest *</label>
      <select id="service" name="service" required>
        <option value="">Select a service...</option>
        <option value="daycare">Daycare</option>
        <option value="boarding">Boarding</option>
        <option value="walking">Walking</option>
        <option value="other">Other / Not Sure</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    
    <!-- Honeypot for spam protection -->
    <input type="text" name="_gotcha" style="display:none">
    
    <button type="submit" class="btn">Send Message</button>
  </form>
  
  <div class="contact-info">
    <h3>Business Information</h3>
    
    <div class="contact-info-item">
      <strong>Location</strong>
      <p>{{ hugo.Data.site.address }}</p>
    </div>
    
    <div class="contact-info-item">
      <strong>Daycare Hours</strong>
      <p>{{ hugo.Data.site.daycare_hours }}</p>
    </div>
    
    <div class="contact-info-item">
      <strong>Boarding Hours</strong>
      <p>{{ hugo.Data.site.boarding_hours }}</p>
    </div>
    
    <div class="contact-info-item">
      <strong>Follow Us</strong>
      <p>
        <a href="{{ .Site.Params.instagram }}" target="_blank" rel="noopener">Instagram</a><br>
        <a href="{{ .Site.Params.facebook }}" target="_blank" rel="noopener">Facebook</a>
      </p>
    </div>
  </div>
</div>
