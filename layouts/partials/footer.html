<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <strong>Coco's Canines</strong>
      <p>{{ hugo.Data.site.address }}</p>
    </div>
    <div class="footer-social">
      <a href="{{ .Site.Params.instagram }}" aria-label="Instagram" target="_blank" rel="noopener">Instagram</a>
      <a href="{{ .Site.Params.threads }}" aria-label="Threads" target="_blank" rel="noopener">Threads</a>
      <a href="{{ .Site.Params.facebook }}" aria-label="Facebook" target="_blank" rel="noopener">Facebook</a>
    </div>
    <div class="footer-copy">
      <p>&copy; {{ now.Year }} Coco's Canines. All rights reserved.</p>
    </div>
  </div>
</footer>
